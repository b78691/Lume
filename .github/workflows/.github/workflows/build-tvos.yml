
name: Build Lume tvOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout Lume
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Download latest LumeEngine
        run: |
          git clone --depth 1 \
            https://github.com/bilipp/LumeEngine.git \
            ../LumeEngine

          cd ../LumeEngine
          echo "LumeEngine commit:"
          git rev-parse HEAD

      - name: Build tvOS app
        run: |
          xcodebuild build \
            -project Lume.xcodeproj \
            -scheme Lume \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/LumeBuild" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/build.log"

          if ! grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build.log"; then
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/LumeBuild/Build/Products/Release-appletvos" \
            -maxdepth 1 -name '*.app' -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "No tvOS app found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Lume-tvOS.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lume-tvOS-Unsigned-IPA
          path: Lume-tvOS.ipa
          retention-days: 30
